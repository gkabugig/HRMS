name: Trigger Vercel deploy

# Workaround for Vercel's GitHub App integration not firing on pushes
# to this repo after it was renamed from gkabugig/hrms to gkabugig/HRMS.
# A Deploy Hook (a plain POST URL from Vercel Settings -> Git -> Deploy
# Hooks) does not depend on that App integration at all, so this keeps
# production deploys working regardless of whatever is broken on
# Vercel's side of the GitHub App webhook.
#
# Required setup (one-time, in the GitHub repo, not here):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  VERCEL_DEPLOY_HOOK_URL
#   Value: the Deploy Hook URL from Vercel (Settings -> Git -> Deploy Hooks)

on:
  push:
    branches:
      - main

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" --fail-with-body
